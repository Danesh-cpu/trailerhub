<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrailerHub</title>
<style>
:root{--bg:#f6f5f2;--surface:#fff;--text:#1a1a1a;--muted:#6b6b6b;--accent:#d62839;--border:#e2e0db;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--surface:#1c1c20;--text:#f2f2f2;--muted:#9a9aa3;--border:#2c2c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121214;--surface:#1c1c20;--text:#f2f2f2;--muted:#9a9aa3;--border:#2c2c33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.4}
header{padding:20px 16px 8px;max-width:960px;margin:0 auto}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p.sub{margin:4px 0 0;color:var(--muted);font-size:.95rem}
main{max-width:960px;margin:0 auto;padding:12px 16px 40px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px}
#drop{border:2px dashed var(--border);border-radius:12px;padding:22px 12px;text-align:center;color:var(--muted);cursor:pointer}
#drop.over{border-color:var(--accent);color:var(--accent)}
#drop b{color:var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.row .full{grid-column:1/-1}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:600;width:100%;margin-top:12px}
.btn:disabled{opacity:.5}
#msg{color:var(--muted);font-size:.9rem;margin-top:8px;min-height:1.2em}
h2{font-size:1.1rem;margin:28px 0 10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.t{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.t video{width:100%;aspect-ratio:16/9;background:#000;display:block}
.t .i{padding:10px 12px}
.t strong{display:block}
.t small{color:var(--muted)}
.t .d{font-size:.88rem;color:var(--muted);margin-top:4px}
.t button{background:none;border:0;color:var(--accent);padding:6px 0 0;font-size:.85rem}
.empty{color:var(--muted);text-align:center;padding:30px 0}
</style>
</head>
<body>
<header>
  <h1>Trailer<span>Hub</span></h1>
  <p class="sub">Upload a movie trailer and add it to your gallery.</p>
</header>
<main>
  <div class="card">
    <div id="drop" tabindex="0"><b>Tap to choose a trailer</b><br>or drag a video file here<div id="fname" style="margin-top:6px"></div></div>
    <input id="file" type="file" accept="video/*" hidden>
    <div class="row">
      <input id="title" class="full" placeholder="Movie title" maxlength="80">
      <select id="genre"><option>Action</option><option>Comedy</option><option>Drama</option><option>Horror</option><option>Sci-Fi</option><option>Animation</option><option>Thriller</option><option>Romance</option></select>
      <input id="year" type="number" placeholder="Year" min="1900" max="2100">
      <textarea id="desc" class="full" rows="2" placeholder="Short description (optional)" maxlength="240"></textarea>
    </div>
    <button class="btn" id="add" disabled>Add trailer</button>
    <div id="msg"></div>
  </div>

  <h2>Gallery <span id="count" style="color:var(--muted);font-weight:400"></span></h2>
  <input id="q" placeholder="Search by title or genre" style="margin-bottom:12px">
  <div id="grid"></div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var file=null, items=[];
  var drop=$('drop'), input=$('file');

  function pick(f){
    if(!f) return;
    if(f.type.indexOf('video/')!==0){$('msg').textContent='Please choose a video file.';return;}
    file=f;
    $('fname').textContent=f.name+' ('+(f.size/1048576).toFixed(1)+' MB)';
    if(!$('title').value) $('title').value=f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
    $('add').disabled=false; $('msg').textContent='';
  }
  drop.onclick=function(){input.click()};
  drop.onkeydown=function(e){if(e.key==='Enter')input.click()};
  input.onchange=function(){pick(input.files[0])};
  drop.ondragover=function(e){e.preventDefault();drop.classList.add('over')};
  drop.ondragleave=function(){drop.classList.remove('over')};
  drop.ondrop=function(e){e.preventDefault();drop.classList.remove('over');pick(e.dataTransfer.files[0])};

  $('add').onclick=function(){
    if(!file) return;
    items.unshift({
      id:Date.now(),
      title:$('title').value.trim()||'Untitled',
      genre:$('genre').value,
      year:$('year').value,
      desc:$('desc').value.trim(),
      url:URL.createObjectURL(file)
    });
    file=null; input.value='';
    ['title','year','desc'].forEach(function(k){$(k).value=''});
    $('fname').textContent=''; $('add').disabled=true;
    $('msg').textContent='Trailer added to the gallery.';
    render();
  };
  $('q').oninput=render;

  function esc(s){return s.replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

  function render(){
    var q=$('q').value.toLowerCase();
    var list=items.filter(function(t){return (t.title+' '+t.genre).toLowerCase().indexOf(q)>-1});
    $('count').textContent=items.length?'('+items.length+')':'';
    $('grid').innerHTML=list.length?list.map(function(t){
      return '<div class="t"><video src="'+t.url+'" controls preload="metadata" playsinline></video><div class="i"><strong>'+esc(t.title)+'</strong><small>'+esc(t.genre)+(t.year?' · '+esc(t.year):'')+'</small>'+(t.desc?'<div class="d">'+esc(t.desc)+'</div>':'')+'<button data-id="'+t.id+'">Remove</button></div></div>';
    }).join(''):'<div class="empty" style="grid-column:1/-1">No trailers yet. Upload your first one above.</div>';
  }
  $('grid').onclick=function(e){
    var id=e.target.getAttribute&&e.target.getAttribute('data-id');
    if(!id) return;
    items=items.filter(function(t){if(String(t.id)===id){URL.revokeObjectURL(t.url);return false}return true});
    render();
  };
  render();
})();
</script>
</body>
</html>
